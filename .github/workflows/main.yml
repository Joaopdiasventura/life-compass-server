name: Continuous Integration and Deployment

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: jpplay/life-compass-server
  CONTAINER_NAME: life-compass-server
  HOST_PORT: "8080"
  CONTAINER_PORT: "8080"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/life-compass-server ./cmd/server

  docker_push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: docker_push
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      DOTENV_CONTENT: ${{ secrets.DOTENV }}
      CPU_LIMIT_APP: "0.35"
      MEM_LIMIT_APP: "256m"
      MEM_RESERVATION_APP: "128m"
    steps:
      - name: Check Docker availability
        run: docker --version

      - name: Docker Login
        shell: bash
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail

          printf '%s' "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" \
            --password-stdin

      - name: Write .env file
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DOTENV_CONTENT:-}" ]; then
            printf '::error::O secret DOTENV é obrigatório para o deploy.\n'
            exit 1
          fi

          umask 077
          printf '%s' "$DOTENV_CONTENT" > .env
          chmod 600 .env

      - name: Pull image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$IMAGE_NAME@${{ needs.docker_push.outputs.image_digest }}"

      - name: Deploy server
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          docker rm -f "$CONTAINER_NAME" || true

          docker run -d --name "$CONTAINER_NAME" \
            --env-file .env \
            --restart unless-stopped \
            --cpus="$CPU_LIMIT_APP" \
            --memory="$MEM_LIMIT_APP" \
            --memory-reservation="$MEM_RESERVATION_APP" \
            --publish "0.0.0.0:${HOST_PORT}:${CONTAINER_PORT}" \
            --publish "[::]:${HOST_PORT}:${CONTAINER_PORT}" \
            "$IMAGE_NAME@${{ needs.docker_push.outputs.image_digest }}"

      - name: Verify IPv4 port is occupied
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            if bash -c ":</dev/tcp/127.0.0.1/${HOST_PORT}" 2>/dev/null; then
              exit 0
            fi

            sleep 1
          done

          printf '::error::A porta IPv4 %s não está ocupada após o deploy.\n' "$HOST_PORT"
          docker ps -a --filter "name=^/${CONTAINER_NAME}$"
          docker logs "$CONTAINER_NAME" || true
          exit 1

      - name: Verify Docker IPv6 publishing
        shell: bash
        run: |
          set -euo pipefail

          if ! ss -tulpn | grep -E "\[::\]:${HOST_PORT}|:::${HOST_PORT}" >/dev/null; then
            printf '::error::A porta %s não foi publicada em IPv6.\n' "$HOST_PORT"
            ss -tulpn | grep "$HOST_PORT" || true
            docker port "$CONTAINER_NAME" || true
            exit 1
          fi

      - name: Cleanup old images
        run: docker image prune -af || true
